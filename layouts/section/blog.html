{{ define "main" }}
<main class="main">
  <div class="blog-full-container index-container">
    <article class="post-single">
      <header class="post-header">
        <div class="header-content">
          <div class="header-center">
            <h1 class="post-title">{{ .Title }}</h1>
            {{ with .Params.description }}<div class="post-description">{{ . }}</div>{{ end }}
          </div>
          <div class="header-right">
            <a href="{{ .RelPermalink }}index.xml" class="rss-button-top" title="Subscribe to {{ .Title }} RSS feed">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 11a9 9 0 0 1 9 9"></path>
                <path d="M4 4a16 16 0 0 1 16 16"></path>
                <circle cx="5" cy="19" r="1"></circle>
              </svg>
              RSS Feed
            </a>
          </div>
        </div>
      </header>
      <div class="post-content">
        {{ .Content }}
      </div>
    </article>

    <div class="index-actions">
      <a href="/series/" class="browse-series-btn">Browse by Series</a>
    </div>

    <section class="post-index">
      <h2 class="index-title">Index of Blogs</h2>
      <input type="search" class="list-search" data-target="blog-index-list"
             placeholder="Search blogs by title or tag…" aria-label="Search blogs">
      <ul class="post-rows" id="blog-index-list" data-page-size="10">
        {{ range .RegularPages.ByDate.Reverse }}
          {{ partial "post-row.html" . }}
        {{ end }}
      </ul>
      <p class="filter-empty" hidden>No blogs match your search.</p>
      <nav class="js-pagination" aria-label="Blog pages" hidden></nav>
    </section>
  </div>
</main>
{{ end }}
